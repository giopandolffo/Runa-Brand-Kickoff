    <circle cx="50" cy="125" r="2" fill="#07162e" opacity="0.3"/>
    <circle cx="60" cy="115" r="1.5" fill="#07162e" opacity="0.2"/>
  </g>
  <!-- LJJL Text -->
  <text x="160" y="100" font-family="'Poppins', sans-serif" font-weight="800" font-style="italic" font-size="68" fill="#ffffff">LJJL</text>
  <!-- LATAM JIU-JITSU LEAGUE -->
  <text x="160" y="140" font-family="'Poppins', sans-serif" font-weight="500" font-size="14" fill="#a7a8ab" letter-spacing="6">LATAM JIU-JITSU LEAGUE</text>
  <!-- Falcon small accent in LJJL -->
  <rect x="460" y="75" width="4" height="4" fill="#d13e48" rx="1"/>
  <rect x="470" y="85" width="4" height="4" fill="#d13e48" rx="1"/>
  <rect x="450" y="85" width="4" height="4" fill="#d13e48" rx="1"/>
</svg>
